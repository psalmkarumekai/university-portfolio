<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Portfolio | Contact</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #38bdf8; --secondary: #818cf8; --success: #34d399; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1e293b; position: fixed; width: 100%; top: 0; border-bottom: 1px solid #334155; z-index: 100; }
        nav { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; }
        .logo { font-size: 1.25rem; font-weight: bold; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; }
        .nav-links a.active, .nav-links a:hover { color: var(--primary); }
        main { flex: 1; max-width: 900px; width: 100%; margin: 8rem auto 4rem auto; padding: 0 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 1.5rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); margin-bottom: 1.2rem; font-size: 1.1rem; }
        
        form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
        input, textarea { width: 100%; padding: 0.8rem; background-color: var(--bg-color); border: 1px solid #334155; color: var(--text-main); border-radius: 6px; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }
        button { background: linear-gradient(to right, var(--primary), var(--secondary)); color: var(--bg-color); font-weight: bold; padding: 0.8rem 2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; align-self: flex-start; }
        button:hover { opacity: 0.9; }
        
        .status-msg { margin-top: 1rem; font-size: 1.1rem; font-weight: 600; display: none; }
        footer { text-align: center; padding: 2rem; color: var(--text-muted); border-top: 1px solid #334155; font-size: 0.9rem; }

        /* --- RESPONSIVE CSS MEDIA QUERIES --- */
        @media (max-width: 768px) {
            main { margin: 7rem auto 3rem auto; padding: 0 1.5rem; }
            h1 { font-size: 2rem; }
        }
        @media (max-width: 600px) {
            nav { flex-direction: column; gap: 1rem; text-align: center; padding: 1rem; }
            .nav-links { gap: 1rem; justify-content: center; width: 100%; }
            main { margin: 10rem auto 2rem auto; padding: 0 1rem; }
            h1 { font-size: 1.75rem; }
            p { font-size: 1rem; }
            form { gap: 0.8rem; }
            input, textarea, button { width: 100%; }
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">CS Applicant Portfolio</a>
            <ul class="nav-links">
                <li><a href="index.html">About</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="interests.html">Coding Interests</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Get In Touch</h1>
        <p>Thank you for reviewing my profile. Please use the interface below if you wish to extend an invitation for an admissions interview or share feedback.</p>
        
        <!-- SECURE ASYNCHRONOUS FORM PROCESSOR -->
        <form id="contactForm" method="POST">
            <!-- Web3Forms Configuration Attributes -->
            <input type="hidden" name="access_key" value="81facb76-7d5a-42c8-8e71-492e622d6400">
            <input type="hidden" name="subject" value="New University Portfolio Inquiry!">
            <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email Address" required>
            <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
            
            <button type="submit" id="submitBtn">Send Message</button>
        </form>
        
        <div id="formStatus" class="status-msg"></div>
    </main>
    <footer>
        <p>&copy; 2026 University Application Portfolio.</p>
    </footer>

    <script>
        const form = document.getElementById('contactForm');
        const statusBox = document.getElementById('formStatus');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.innerText = "Transmitting Message...";
            submitBtn.disabled = true;

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            // Asynchronous Fetch Request routing message to your Gmail
            fetch('https://web3forms.com', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                let res = await response.json();
                if (response.status == 200) {
                    statusBox.style.color = "var(--success)";
                    statusBox.innerText = "Message sent instantly to my inbox!";
                    form.reset();
                } else {
                    statusBox.style.color = "#f87171";
                    statusBox.innerText = res.message;
                }
            })
            .catch(error => {
                statusBox.style.color = "#f87171";
                statusBox.innerText = "Network transmission failed. Please try again.";
            })
            .then(() => {
                statusBox.style.display = "block";
                submitBtn.innerText = "Send Message";
                submitBtn.disabled = false;
                setTimeout(() => { statusBox.style.display = "none"; }, 5000);
            });
        });
    </script>
</body>
</html>

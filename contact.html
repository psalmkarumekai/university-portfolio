<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Portfolio | Contact</title>
    <style>
        :root { --bg-color: #0f172a; --card-bg: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --primary: #38bdf8; --secondary: #818cf8; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: #1e293b; position: fixed; width: 100%; top: 0; border-bottom: 1px solid #334155; }
        nav { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 2rem; }
        .logo { font-size: 1.25rem; font-weight: bold; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 500; }
        .nav-links a.active, .nav-links a:hover { color: var(--primary); }
        main { flex: 1; max-width: 900px; width: 100%; margin: 8rem auto 4rem auto; padding: 0 2rem; }
        h1 { font-size: 2.5rem; margin-bottom: 1.5rem; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: var(--text-muted); margin-bottom: 1.2rem; font-size: 1.1rem; }
        form { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; }
        input, textarea { width: 100%; padding: 0.8rem; background-color: var(--bg-color); border: 1px solid #334155; color: var(--text-main); border-radius: 6px; font-size: 1rem; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); }
        button { background: linear-gradient(to right, var(--primary), var(--secondary)); color: var(--bg-color); font-weight: bold; padding: 0.8rem 2rem; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; align-self: flex-start; }
        footer { text-align: center; padding: 2rem; color: var(--text-muted); border-top: 1px solid #334155; font-size: 0.9rem; }
        /* --- RESPONSIVE CSS MEDIA QUERIES --- */

/* For smaller desktop screens and tablets (under 768px wide) */
@media (max-width: 768px) {
    main {
        margin: 7rem auto 3rem auto; /* Reduces spacing on medium screens */
        padding: 0 1.5rem;
    }
    h1 {
        font-size: 2rem; /* Shrinks the headline text so it doesn't wrap awkwardly */
    }
}

/* For smartphones (under 600px wide) */
@media (max-width: 600px) {
    nav {
        flex-direction: column; /* Stacks the logo on top of the links */
        gap: 1rem;
        text-align: center;
        padding: 1rem;
    }
    .nav-links {
        gap: 1rem; /* Closes the spacing between mobile menu buttons */
        justify-content: center;
        width: 100%;
    }
    main {
        margin: 10rem auto 2rem auto; /* Shifts text down since the header stacked taller */
        padding: 0 1rem;
    }
    h1 {
        font-size: 1.75rem;
    }
    p {
        font-size: 1rem; /* Highly readable body text size for mobile panels */
    }
    .card, .interactive-box {
        padding: 1.2rem; /* Reduces inner card spacing to make room for content */
    }
    .tool-ui {
        flex-direction: column; /* Stacks the binary input box on top of its button */
        align-items: stretch;
    }
    input.tool-input, .tool-btn {
        width: 100%; /* Makes forms expand cleanly across phone displays */
    }
}

    </style>
</head>
<body>
    <header>
        <nav>
            <a href="index.html" class="logo">CS Applicant Portfolio</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="education.html">Education</a></li>
                <li><a href="interests.html">Coding Interests</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Get In Touch</h1>
        <p>Thank you for reviewing my profile. Please use the interface below if you wish to extend an invitation for an admissions interview or share feedback.</p>
        <form onsubmit="event.preventDefault(); alert('Form submitted smoothly!'); this.reset();">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email Address" required>
            <textarea rows="5" placeholder="Your Message" required></textarea>
            <button type="submit">Send Message</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 University Application Portfolio.</p>
    </footer>
</body>
</html>
